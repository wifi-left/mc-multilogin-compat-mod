name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - mc_version: "1.21.1"
            loader_version: "0.16.9"
            fabric_version: "0.100.8+1.21.1"
            java_version: "21"
          - mc_version: "1.21.4"
            loader_version: "0.16.9"
            fabric_version: "0.119.3+1.21.4"
            java_version: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: >
          ./gradlew build
          -Pminecraft_version=${{ matrix.mc_version }}
          -Ploader_version=${{ matrix.loader_version }}
          -Pfabric_version=${{ matrix.fabric_version }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mc-multilogin-compat-mod-mc${{ matrix.mc_version }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
